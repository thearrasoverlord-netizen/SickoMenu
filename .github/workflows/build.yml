name: Build Project

on:
  workflow_dispatch:
  release:
    types: [published]
  #push:
    #branches: [ "main" ]
  
jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug_Itch_x86
            platform: x86
            configuration: Debug
            path: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build SickoMenu.dll
        shell: bash
        run: MSBuild.exe -property:Configuration=${{ matrix.configuration }} -property:PlatformToolset=v143 -property:Platform=${{ matrix.platform }}

      - name: Build version.dll
        shell: bash
        run: MSBuild.exe -property:Configuration=${{ matrix.configuration }}_Version -property:PlatformToolset=v143 -property:Platform=${{ matrix.platform }}

      - name: Package
        shell: cmd
        run: |
          move /y "${{ matrix.path }}\SickoMenu.dll" SickoMenu.dll
          move /y "${{ matrix.path }}_Version\version.dll" version.dll
          tar -caf "${{ matrix.name }}.zip" SickoMenu.dll version.dll LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  # Manual runs build and upload artifacts only. Releases are created only
  # when this workflow is triggered by a published GitHub Release.
  AutoRelease:
    if: github.event_name == 'release'
    runs-on: windows-2025
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
      
      - name: Automatic Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: false
          generate_release_notes: true
          files: |
            Debug_Itch_x86/Debug_Itch_x86.zip
